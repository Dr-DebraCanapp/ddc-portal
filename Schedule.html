<body data-screen-label="Schedule">

  <!-- React -->

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Supabase (cloud backend — required) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>

  <!-- DICOM viewer stack (same as the reviewer portal) -->
  <script src="https://unpkg.com/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://unpkg.com/dicom-parser@1.8.21/dist/dicomParser.min.js"></script>
  <script src="https://unpkg.com/cornerstone-core@2.6.1/dist/cornerstone.min.js"></script>
  <script src="https://unpkg.com/cornerstone-math@0.1.10/dist/cornerstoneMath.min.js"></script>
  <script src="https://unpkg.com/cornerstone-wado-image-loader@4.13.0/dist/cornerstoneWADOImageLoader.bundle.min.js"></script>
  <!-- pdf.js — text extraction for intake auto-fill -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }
  </script>
  <script>
    (function initCornerstone() {
      if (typeof cornerstone === 'undefined' || typeof cornerstoneWADOImageLoader === 'undefined') { console.warn('[schedule] cornerstone not loaded'); return; }
      try {
        cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
        cornerstoneWADOImageLoader.external.dicomParser = dicomParser;
        const V = '4.13.0';
        const workerSrc = `https://unpkg.com/cornerstone-wado-image-loader@${V}/dist/cornerstoneWADOImageLoaderWebWorker.min.js`;
        const codecsSrc = `https://unpkg.com/cornerstone-wado-image-loader@${V}/dist/cornerstoneWADOImageLoaderCodecs.min.js`;
        const blobUrl = URL.createObjectURL(new Blob([`self.importScripts('${workerSrc}');`], { type: 'application/javascript' }));
        cornerstoneWADOImageLoader.webWorkerManager.initialize({
          maxWebWorkers: Math.max(1, (navigator.hardwareConcurrency || 2) - 1),
          startWebWorkersOnDemand: true, webWorkerPath: blobUrl,
          taskConfiguration: { decodeTask: { initializeCodecsOnStartup: false, strict: false, codecsPath: codecsSrc, usePDFJS: false } },
        });
        cornerstoneWADOImageLoader.configure({ useWebWorkers: true, decodeConfig: { convertFloatPixelDataToInt: false } });
        window.__cornerstone_ready = true;
        console.log('[schedule] cornerstone ready');
      } catch (e) { console.warn('[schedule] cornerstone init failed', e); }
    })();
  </script>

  <!-- Schedule app -->
  <script src="schedule-cloud.js"></script>
